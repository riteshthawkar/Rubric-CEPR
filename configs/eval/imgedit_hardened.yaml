# Matched benchmark protocol; recorded evaluations have separate receipts.
name: rubric_cepr_base_imgedit
benchmark: imgedit
runtime:
  python_executable: python
  generation_device: cuda
  env_file: null
  dry_run: false
  log_dir: outputs/logs
model:
  backend: official_diffusers
  model_type: base
  base_model: Qwen/Qwen-Image-Edit-2509
  revision: d3968ef930e841f4c73640fb8afa3b306a78167e
  checkpoint_path: null
  lora_scale: null
  model_name: rubric_cepr_base_imgedit
  torch_dtype: bfloat16
  local_files_only: false
  model_id_with_origin_paths: Qwen/Qwen-Image-Edit-2509:transformer/diffusion_pytorch_model*.safetensors,Qwen/Qwen-Image:text_encoder/model*.safetensors,Qwen/Qwen-Image:vae/diffusion_pytorch_model.safetensors
dataset:
  edit_json: data/processed/benchmark/imgedit/basic_edit.json
  origin_img_root: data/processed/benchmark/imgedit/original_images
  prompts_json: data/benchmark_tools/imgedit/Benchmark/Basic/prompts.json
generation:
  seed: 42
  seed_strategy: constant_per_record
  num_inference_steps: 40
  true_cfg_scale: 4.0
  guidance_scale: 1.0
  negative_prompt: ' '
  num_images_per_prompt: 1
  preserve_input_resolution: false
  export_batch_size: 1
output:
  edited_images_dir: outputs/benchmark_images/imgedit
  scores_dir: outputs/scores/imgedit
  summary_path: outputs/scores/imgedit/summary.json
  allow_resume_mismatch: false
scoring:
  provider: openai
  openai_base_url: https://api.openai.com/v1
  score_run_id: rubric-cepr-imgedit
  fresh_only: true
  num_processes: 4
  openai_model: gpt-4o-2024-11-20
  expected_openai_model: gpt-4o-2024-11-20
  temperature: 0.0
  force_rescore: true
  strict_response_parser: true
  openai_timeout_seconds: 60
  openai_max_retries: 2
  retry_num_processes: 1
  max_retry_rounds: 5
  retry_sleep_seconds: 10
  allow_partial: false
  implementation_artifacts:
  - src/qwen_edit_project/eval/imgedit_basic_bench.py
  - src/qwen_edit_project/eval/imgedit_scores.py
  - src/qwen_edit_project/eval/run_imgedit_score.py
  - src/qwen_edit_project/eval/score_receipts.py
  - src/qwen_edit_project/eval/summarize_scores.py
evaluation_contract:
  enabled: true
  canonical_protocol: imgedit-openai-fresh-score/v1
  output_id_length: 16
  require_dataset_artifacts: true
  require_config_artifact: true
  require_judge_artifacts: true
  require_implementation_artifacts: true
  runtime_provenance:
    require_accelerator: true
    required_packages:
    - diffusers
    - numpy
    - openai
    - Pillow
    - torch
    - transformers
  implementation_artifacts:
  - src/qwen_edit_project/eval/evaluation_contract.py
  - src/qwen_edit_project/eval/export_imgedit.py
  - src/qwen_edit_project/eval/export_provenance.py
  - src/qwen_edit_project/eval/score_receipts.py
  - src/qwen_edit_project/utils/qwen_pipeline.py
  - src/qwen_edit_project/utils/prompting.py
  - src/rubric_cepr/cli.py
  - src/rubric_cepr/runtime.py
  - src/qwen_edit_project/train/diffusers_qwen_edit_lora_reproduction_v1.py
prompting:
  use_prompt_polish: false
