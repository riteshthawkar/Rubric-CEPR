# Matched benchmark protocol; recorded evaluations have separate receipts.
name: rubric_cepr_base_gedit
benchmark: gedit
runtime:
  python_executable: python
  generation_device: cuda
  env_file: null
  dry_run: false
  log_dir: outputs/logs
model:
  backend: official_diffusers
  model_type: base
  base_model: Qwen/Qwen-Image-Edit-2509
  revision: d3968ef930e841f4c73640fb8afa3b306a78167e
  checkpoint_path: null
  lora_scale: null
  model_name: rubric_cepr_base_gedit
  torch_dtype: bfloat16
  local_files_only: false
  model_id_with_origin_paths: Qwen/Qwen-Image-Edit-2509:transformer/diffusion_pytorch_model*.safetensors,Qwen/Qwen-Image:text_encoder/model*.safetensors,Qwen/Qwen-Image:vae/diffusion_pytorch_model.safetensors
dataset:
  source: huggingface
  dataset_name: stepfun-ai/GEdit-Bench
  revision: 50766778e2a737474c7e9bdf84cdce82c3ea3f4f
  split: train
  local_path: null
  instruction_language: all
  task_type: all
  selection:
    mode: stratified_language_task
    languages:
    - cn
    - en
    per_language_per_task: 15
    seed: 42
generation:
  seed: 42
  seed_strategy: constant_per_record
  num_inference_steps: 40
  true_cfg_scale: 4.0
  guidance_scale: 1.0
  negative_prompt: ' '
  num_images_per_prompt: 1
  preserve_input_resolution: false
output:
  edited_images_dir: outputs/benchmark_images/gedit
  scores_dir: outputs/scores/gedit
  summary_path: outputs/scores/gedit/summary.json
  allow_resume_mismatch: false
scoring:
  provider: openai
  openai_base_url: https://api.openai.com/v1
  score_run_id: rubric-cepr-gedit
  fresh_only: true
  backbone: gpt4o
  expected_openai_model: gpt-4.1
  save_dir: outputs/scores/gedit
  scorer_secret_env_path: secret.env
  allow_partial: false
  strict_response_parser: true
  request_max_tokens: 1400
  request_timeout_seconds: 60
  thread_workers: 6
  item_max_retries: 3
  retry_initial_backoff_seconds: 2.0
  retry_max_backoff_seconds: 30.0
  implementation_artifacts:
  - src/qwen_edit_project/eval/run_gedit_score.py
  - src/qwen_edit_project/eval/score_receipts.py
  - src/qwen_edit_project/eval/summarize_scores.py
  - data/benchmark_tools/step1x-edit/GEdit-Bench/run_gedit_score.py
  - data/benchmark_tools/step1x-edit/GEdit-Bench/calculate_statistics.py
  - data/benchmark_tools/step1x-edit/GEdit-Bench/viescore/__init__.py
  - data/benchmark_tools/step1x-edit/GEdit-Bench/viescore/utils.py
  - data/benchmark_tools/step1x-edit/GEdit-Bench/viescore/vie_prompts.py
  - data/benchmark_tools/step1x-edit/GEdit-Bench/viescore/mllm_tools/openai.py
evaluation_contract:
  enabled: true
  canonical_protocol: gedit-openai-fresh-score/v1
  output_id_length: 16
  require_dataset_artifacts: true
  require_config_artifact: true
  require_judge_artifacts: true
  require_implementation_artifacts: true
  runtime_provenance:
    require_accelerator: true
    required_packages:
    - datasets
    - diffusers
    - megfile
    - numpy
    - openai
    - Pillow
    - requests
    - torch
    - transformers
  implementation_artifacts:
  - src/qwen_edit_project/eval/evaluation_contract.py
  - src/qwen_edit_project/eval/export_gedit.py
  - src/qwen_edit_project/eval/export_provenance.py
  - src/qwen_edit_project/eval/gedit_selection.py
  - src/qwen_edit_project/eval/score_receipts.py
  - src/qwen_edit_project/utils/qwen_pipeline.py
  - src/qwen_edit_project/utils/prompting.py
  - src/rubric_cepr/cli.py
  - src/rubric_cepr/runtime.py
  - src/qwen_edit_project/train/diffusers_qwen_edit_lora_reproduction_v1.py
prompting:
  use_prompt_polish: false
