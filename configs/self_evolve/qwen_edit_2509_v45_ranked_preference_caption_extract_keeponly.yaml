    removal_fallback_min_preservation: 0.85
    removal_fallback_min_artifact_free: 0.85
    removal_fallback_max_edited_source_score_ratio: 1.15
    removal_fallback_max_edited_source_score_margin: 0.05
curriculum:
  num_rounds: 2
  # Use explicit edit-type quotas instead of depending on manifest row order.
  # This keeps every round exposed to the conservative-edit failure modes that
  # matter for external benchmarks: object removal/replacement, local changes,
  # and non-target preservation.
  record_schedule: stratified_metadata
  stratify_metadata_key: scheduled_edit_type
  stratify_interleave: true
  stratify_targets:
    object_removal: 0.11
    object_replacement: 0.11
    subject_extraction: 0.10
    object_addition: 0.09
    attribute_change: 0.09
    color_change: 0.09
    material_change: 0.09
    spatial_move: 0.09
    background_change: 0.09
    style_transfer: 0.07
    local_enhancement: 0.07
  stratify_shuffle_seed: 123
  proposals_per_image: 1
  inject_scheduled_edit_type: true
  coverage_schedule_mode: global_cycle
  respect_record_edit_families: true
  min_removable_object_score_for_object_schedule: 0.55
  min_small_object_separability_for_object_schedule: 0.45
  coverage_edit_type_schedule:
    - object_removal
    - object_replacement
    - subject_extraction
    - object_addition
    - attribute_change
    - color_change
    - material_change
    - spatial_move
    - background_change
    - style_transfer
    - local_enhancement
    - subject_extraction
    - object_replacement
    - object_removal
  initial_level: 2
  min_level: 1
  max_level: 3
  promote_at: 0.65
  demote_at: 0.25
  max_records_per_round: 96
training:
  trigger: launch
  base_train_config: configs/train/lora_2509_diffusers.yaml
  current_checkpoint_path: null
  continue_with_trained_checkpoint: true
  trained_checkpoint_backend: official_diffusers
  resume_from_latest: true
  # Fast-pilot defaults. Increase rank/modules after reward traces look correct.
  learning_rate: 7.5e-7
  num_epochs: 1
  max_train_steps: 96
  gradient_accumulation_steps: 1
  checkpointing_steps: 0
  offload: false
  train_config_overrides:
    lora:
      lora_rank: 16
      lora_alpha: 16
      lora_target_modules: to_q,to_k,to_v,to_out.0,add_q_proj,add_k_proj,add_v_proj,to_add_out
      lora_reference_l2_weight: 0.08
      lora_reference_max_relative_delta: 0.03
  preference:
    enabled: true
    use_cumulative_manifest: true
    training_objective: pairwise_sdpo
    preference_beta: 4.0
    preference_margin: 0.01
    preference_sft_weight: 0.0
    preference_reference_mode: initial_lora
    preference_sdpo_epsilon: 1.0e-12
    max_pairs_per_group: 5
    score_mode: conservative
    exclude_rank_only_feasible_rejects: true
    accept_strict_vlm_success_as_positive: true
    require_success_filter_for_accepted: true
    strict_vlm_positive_statuses:
      - accepted
      - rejected
    # Strict VLM positives intentionally bypass old hard-gate failures such as
    # cepr_edit_specificity when the decomposed judge and raw conservative
    # reward agree. Keep a raw reward floor, but do not require effective_reward,
    # because effective_reward is zeroed by exactly the gates this path repairs.
    strict_vlm_positive_min_effective_reward: null
    strict_vlm_positive_min_raw_reward: 0.55
    min_pairs: 4
    fallback_to_weighted_sft: false
    min_score_margin: 0.04
    min_score_margin_by_edit_type:
      object_removal: 0.03
      object_replacement: 0.03
    min_chosen_reward: 0.35
    base_relative:
      enabled: true
      start_round: 1
      score_mode: conservative
      reference_roles:
        - reference:base
      policy_roles:
        - policy
      positive_roles:
        - policy
      min_policy_over_reference_margin: 0.04
      min_policy_over_reference_margin_by_edit_type:
        object_replacement: 0.07
        object_removal: 0.04
      min_reference_over_policy_margin: 0.005
      min_reference_over_policy_margin_by_edit_type:
        # Replacement candidates are stochastic and close-scoring base samples
        # should not become anti-edit "reference wins"; require a clear quality
        # advantage before training no-harm against a policy replacement.
        object_replacement: 0.05
        object_removal: 0.005
      min_reference_score: 0.50
      train_reference_wins: true
      skip_ambiguous: true
      # Be conservative against the initial/base editor. Replacement mistakes
      # are costly, so if the base reference is better we train the no-harm
      # reference win instead of falling back to a policy self-pair.
      fallback_to_self_pairs: false
      fallback_to_self_pairs_by_edit_type:
        # Removal can still use strict self-pairs because the structured absence
        # fallback gives a strong object-gone signal. Replacement uses the base
        # reference/opponent signal instead to avoid semantic drift.
        object_removal: true
        object_replacement: false
      reference_win_weight_scale: 1.20
      reference_win_weight_scale_by_edit_type:
        object_replacement: 0.75
        object_removal: 1.10
      reference_win_preference_sft_weight: 0.0
      min_reference_component_scores:
        cepr_preservation: 0.66
        cepr_validity: 0.74
        cepr_taxonomy: 0.20
    vlm_pair_guard:
      enabled: true
      reject_explicit_vlm_fail: true
      explicit_fail_floor: 0.05
      require_reliable_chosen: true
      require_reliable_pair: false
      min_chosen_judge: 0.60
      min_chosen_semantic: 0.55
      min_chosen_preservation: 0.65
      min_chosen_artifact_free: 0.65
      min_judge_margin: 0.0
      min_weight_multiplier: 0.70
    pareto_pair_guard:
      enabled: true
      # Scalar reward wins are not enough for conservative image editing. A
      # preference pair must improve edit success while preserving the
      # non-target image and avoiding quality/artifact regressions.
      min_edit_delta: 0.02
      min_edit_delta_by_edit_type:
        object_addition: 0.03
        object_removal: 0.04
        object_replacement: 0.04
      source_noop_min_edit_delta: 0.12
      source_noop_min_edit_delta_by_edit_type:
        object_removal: 0.18
        object_replacement: 0.18
      edit_success_axis:
        reducer: max
        metrics:
          - semantic_edit
          - internal_vlm_judge_edit_success
          - internal_vlm_judge_target_correctness
          - internal_vlm_judge_target_object_visible_after
          - internal_vlm_judge_object_absence
      min_chosen_scores:
        semantic_edit: 0.35
        preservation: 0.68
        artifact_free: 0.70
        validity: 0.75
        judge: 0.60
      min_chosen_scores_by_edit_type:
        object_removal:
          semantic_edit: 0.45
          preservation: 0.76
          artifact_free: 0.75
          validity: 0.82
          judge: 0.65
          internal_vlm_judge_object_absence: 0.85
        object_replacement:
          semantic_edit: 0.48
          preservation: 0.76
          artifact_free: 0.75
          validity: 0.82
          judge: 0.65
          internal_vlm_judge_target_correctness: 0.80
          internal_vlm_judge_target_object_visible_after: 0.80
      no_degradation_axes:
        preservation:
          reducer: min
          metrics:
            - cepr_preservation
            - conservative_outside_preservation
            - rubric_preservation
            - internal_vlm_judge_preservation
          allowed_drop: 0.02
        artifact_free:
          reducer: min
          metrics:
            - internal_vlm_judge_artifact_free
            - cepr_validity
            - rubric_validity
          allowed_drop: 0.02
        judge:
          reducer: max
          metrics:
            - internal_vlm_judge_score
          allowed_drop: 0.05
      min_weight_multiplier: 0.75
      edit_margin_weight_scale: 0.20
      edit_margin_clip: 0.50
    productive_group_filter:
      enabled: true
      hard_filter: true
      hard_filter_self_pairs_only: true
      success_scope: policy
      policy_roles:
        - policy
      min_candidates: 2
      min_success_rate: 0.20
      min_success_rate_by_edit_type:
        object_removal: 0.10
        object_replacement: 0.10
      min_success_count_by_edit_type:
        object_removal: 1
        object_replacement: 1
      max_success_rate: 0.80
      require_internal_vlm_judge: true
      require_reliable_judge: true
      min_judge_score: 0.60
      min_judge_semantic: 0.55
      min_judge_preservation: 0.65
      min_judge_artifact_free: 0.65
      min_component_scores:
        semantic_edit: 0.30
        preservation: 0.66
        validity: 0.74
    positive_success_filter:
      enabled: true
      require_internal_vlm_judge: true
      require_reliable_judge: true
      min_judge_score: 0.60
      min_judge_semantic: 0.55
      min_judge_preservation: 0.65
      min_judge_artifact_free: 0.65
      min_component_scores:
        semantic_edit: 0.35
        preservation: 0.68
        validity: 0.78
      by_edit_type:
        subject_extraction:
          min_judge_score: 0.65
          min_judge_semantic: 0.65
          min_judge_preservation: 0.70
          min_judge_artifact_free: 0.75
          min_component_scores:
            semantic_edit: 0.40
            preservation: 0.45
            validity: 0.78
            artifact_free: 0.72
            reward: 0.45
            internal_vlm_judge_preservation: 0.70
        object_removal:
          min_judge_score: 0.65
          min_judge_semantic: 0.65
          min_judge_preservation: 0.75
          min_judge_artifact_free: 0.75
          min_component_scores:
            semantic_edit: 0.45
            # Object removal is evaluated by a decomposed contract: object
            # absence, VLM preservation, outside preservation, and natural fill.
            # The older scalar CEPR preservation proxy can under-score valid
            # inpainting because the target area itself must change.
            preservation: 0.76
            validity: 0.84
            artifact_free: 0.72
            reward: 0.55
            conservative_region_reward: 0.45
            conservative_outside_preservation: 0.65
            conservative_localization_precision: 0.30
            internal_vlm_judge_object_absence: 0.85
            internal_vlm_judge_fill_naturalness: 0.55
        object_replacement:
          min_judge_score: 0.65
