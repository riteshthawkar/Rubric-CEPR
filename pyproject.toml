[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accv-self-evolving-image-editing"
version = "1.0.0rc1"
description = "Artifact-backed ACCV extraction recipe and self-evolving editing reference implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "Pillow>=10", "numpy>=1.24"]

[project.optional-dependencies]
model = ["torch", "torchvision", "diffusers", "transformers", "accelerate", "peft", "safetensors", "huggingface-hub", "tqdm", "tensorboard"]
eval = ["datasets", "openai", "requests", "megfile", "loguru", "opencv-python", "scipy"]
dev = ["pytest>=8"]

[project.scripts]
accv-v1 = "accv_v1.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
