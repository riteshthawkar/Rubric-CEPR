[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubric-cepr"
version = "1.0.0rc2"
description = "Self-evolving image editing via reward-verified self-distillation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "Pillow>=10", "numpy>=1.24"]

[project.optional-dependencies]
model = ["torch", "torchvision", "diffusers", "transformers", "accelerate", "peft", "safetensors", "huggingface-hub", "tqdm", "tensorboard"]
eval = ["datasets", "openai", "requests", "megfile", "loguru", "opencv-python", "scipy"]
dev = ["pytest>=8"]

[project.scripts]
rubric-cepr = "rubric_cepr.cli:main"

[project.urls]
Repository = "https://github.com/riteshthawkar/Rubric-CEPR"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
